name: 14 · Fallback — missing configuration
on:
  workflow_dispatch:
    inputs:
      data:
        description: Schema and layout are deliberately absent; the native input stays usable
        type: string
        required: true
        default: '{"name":"Fallback explorer","repetitions":1,"enthusiastic":true}'
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Native fallback still runs
        env:
          DEMO_DATA: ${{ inputs.data }}
        run: python scripts/run_demo.py 01-quick-start
