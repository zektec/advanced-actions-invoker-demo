# Generated by scripts/generate.py; edit examples/ instead.
name: 01 · Quick start
'on':
  workflow_dispatch:
    inputs:
      schema:
        description: JSON Schema — leave unchanged
        type: string
        required: true
        default: '{"type":"object","properties":{"name":{"type":"string","title":"Name","minLength":1,"maxLength":80},"repetitions":{"type":"integer","title":"Repetitions","minimum":1,"maximum":5},"enthusiastic":{"type":"boolean","title":"Enthusiastic greeting"}},"required":["name","repetitions","enthusiastic"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}'
      layout:
        description: JSON Forms layout — leave unchanged
        type: string
        required: true
        default: '{"type":"VerticalLayout","elements":[{"type":"Control","scope":"#/properties/name"},{"type":"Control","scope":"#/properties/repetitions"},{"type":"Control","scope":"#/properties/enthusiastic"}]}'
      data:
        description: Form values (JSON without the extension)
        type: string
        required: true
        default: '{"name":"GitHub Actions explorer","repetitions":2,"enthusiastic":true}'
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install validators
      run: python -m pip install -r requirements.txt
    - name: Parse form inputs
      id: form
      uses: zektec/advanced-actions-invoker-utils@291d2a5e075450f32cba22ea1584a2cd84a60f2c
      with:
        schema: ${{ inputs.schema }}
        layout: ${{ inputs.layout }}
        data: ${{ inputs.data }}
    - name: Validate and create demo plan
      env:
        DEMO_DATA: ${{ inputs.data }}
        DEMO_PARSED_OUTPUTS: ${{ toJSON(steps.form.outputs) }}
      run: python scripts/run_demo.py 01-quick-start
    - name: Downloadable demo plan
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: 01-quick-start-plan
        path: demo-plan.json
        retention-days: 7
